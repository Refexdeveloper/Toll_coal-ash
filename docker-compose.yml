services:
  coal-ash:
    image: node:18
    container_name: coal-ash
    working_dir: /app/server
    volumes:
      - ./server:/app/server
      - ./client:/app/client
    command: npm start
    env_file:
      - ./server/.env
    expose:
      - "4090"
    ports:
      - "4090:4090"
    networks:
      - proxy

networks:
  proxy:
    external: true
